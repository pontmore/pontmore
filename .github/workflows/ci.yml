name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: pontmore_test
          POSTGRES_USER: pontmore
          POSTGRES_PASSWORD: pontmore
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pontmore -d pontmore_test" --health-interval 2s
          --health-timeout 2s --health-retries 20
    env:
      PONTMORE_TEST_DATABASE_URL: postgres://pontmore:pontmore@127.0.0.1:5432/pontmore_test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: extractions/setup-just@v3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: just check
