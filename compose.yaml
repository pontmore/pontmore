services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pontmore}
      POSTGRES_USER: ${POSTGRES_USER:-pontmore}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pontmore-development-only}
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 2s
      timeout: 2s
      retries: 20
    volumes:
      - pontmore-postgres:/var/lib/postgresql/data

  pontmored:
    # Built by Nix and loaded by `just docker-up` (scripts/container-image.sh).
    image: ${PONTMORE_IMAGE:-pontmored:local}
    pull_policy: never
    # Local-only override: reads the owner-only bind-mounted operator password.
    user: "0:0"
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    ports:
      - "127.0.0.1:${PONTMORE_CLIENT_PORT:-7300}:7300"
      - "127.0.0.1:${PONTMORE_UI_PORT:-7301}:7301"
    volumes:
      - ./.pontmore:/run/pontmore:ro

volumes:
  pontmore-postgres:
