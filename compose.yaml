services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: pontmore
      POSTGRES_USER: pontmore
      POSTGRES_PASSWORD: pontmore-development-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pontmore"]
      interval: 2s
      timeout: 2s
      retries: 20
    volumes:
      - pontmore-postgres:/var/lib/postgresql/data

  pontmored:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PONTMORE_DATABASE_URL: postgres://pontmore:pontmore-development-only@postgres/pontmore
      PONTMORE_LISTEN: 0.0.0.0:7300
      RUST_LOG: pontmored=info,tower_http=info
    ports:
      - "127.0.0.1:7300:7300"

volumes:
  pontmore-postgres:
